[project]
name = "p2p-qt-chat"
version = "0.1.0"
description = "A lightweight, zero-configuration peer-to-peer messaging application for local networks. This serverless Python application automatically discovers other users on your LAN and enables direct messaging without requiring any central infrastructure."
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Amr Morsy" }]
dependencies = [
    "certifi==2025.1.31",
    "charset-normalizer==3.4.1",
    "idna==3.10",
    "iniconfig==2.1.0",
    "markdown-it-py==3.0.0",
    "mdurl==0.1.2",
    "packaging==25.0",
    "pip==25.0.1",
    "pluggy==1.5.0",
    "pygments==2.19.1",
    "pyside6==6.9.0",
    "pyside6-addons==6.9.0",
    "pyside6-essentials==6.9.0",
    "pytest==8.3.5",
    "pytest-qt==4.4.0",
    "requests==2.32.3",
    "rich==14.0.0",
    "shiboken6==6.9.0",
    "tk==0.1.0",
    "urllib3==2.4.0",
]
